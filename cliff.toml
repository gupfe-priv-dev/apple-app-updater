# Release notes, generated by git-cliff from the commit subjects in a tag range.
#
# Only `feat:` and `fix:` reach the notes. Everything else — docs, chores,
# refactors, CI, an unprefixed subject — is dropped, so a release lists what
# changed for someone *using* the app rather than every commit that happened.
# The filter is the point.
#
# Preview what the next release would say, at any time:
#     git cliff --unreleased

[changelog]
header = ""
# One section per group, one bullet per commit. No version heading: the GitHub
# release already carries the tag as its title.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
{% if previous.version and version %}
**Full changelog**: https://github.com/gupfe-priv-dev/apple-app-updater/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
# The compare link lives in `body`, not `footer`: footer is rendered once for
# the whole changelog and its context holds `releases`, not a single release —
# so `version` and `previous.version` are simply empty there. The URL is
# written out rather than read from `remote.github`, which git-cliff populates
# only by calling the GitHub API, an unauthenticated call that 404s.
footer = ""
trim = true

[git]
conventional_commits = true
# Drop anything that isn't a conventional commit rather than listing it
# verbatim under a catch-all heading.
filter_unconventional = true
# Drop commits no parser gave a group to — i.e. everything the `.*` rule skips.
filter_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix",  group = "<!-- 1 -->Fixed" },
  { message = ".*", skip = true },
]
# Releases are tagged vX.Y.Z. Previews are never tagged.
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
