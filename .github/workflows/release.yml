name: Release

# Manually-triggered build + release pipeline.
# Go to Actions → Release → Run workflow → pick patch/minor/major → optional notes.
# The tag is auto-computed from the highest existing semver tag; provide
# `tag_override` only when you need something off the increment line
# (e.g. v2.0.0-rc1). Only people with write access can dispatch this — so
# for a personal/private repo, that's just the owner.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which segment of the latest tag to bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      tag_override:
        description: "Explicit tag (overrides bump, e.g. v2.0.0-rc1). Leave empty for auto."
        required: false
        default: ""
      notes:
        description: "Release notes (markdown). Leave empty to generate them from feat:/fix: commits."
        required: false
        default: ""

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags so build-app.sh can run `git describe --tags`
          # and `git rev-list --count` to stamp a real version into Info.plist
          fetch-depth: 0

      - name: Compute next tag
        id: compute
        run: |
          if [[ -n "${{ inputs.tag_override }}" ]]; then
            TAG="${{ inputs.tag_override }}"
            echo "Using explicit override: $TAG"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            LATEST="${LATEST:-v0.0.0}"
            VER="${LATEST#v}"
            IFS='.' read -r MAJ MIN PATCH <<< "$VER"
            case "${{ inputs.bump }}" in
              major) MAJ=$((MAJ + 1)); MIN=0; PATCH=0 ;;
              minor) MIN=$((MIN + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "::error::unknown bump kind"; exit 1 ;;
            esac
            TAG="v${MAJ}.${MIN}.${PATCH}"
            echo "Latest tag: $LATEST  →  Next (${{ inputs.bump }}): $TAG"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $TAG"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create local tag (so build-app.sh stamps the right version)
        run: git tag -a "${{ steps.compute.outputs.tag }}" -m "${{ steps.compute.outputs.tag }}"

      - name: Generate release notes
        id: notes
        run: |
          # git-cliff turns the commit range since the previous tag into notes,
          # keeping only feat:/fix: subjects (see cliff.toml). Pinned to a
          # version rather than "latest" so a release built today and one built
          # next year format their notes the same way.
          CLIFF_VER=2.13.1
          case "$(uname -m)" in
            arm64) TARGET=aarch64-apple-darwin ;;
            *)     TARGET=x86_64-apple-darwin  ;;
          esac
          curl -fsSL --retry 3 \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VER}/git-cliff-${CLIFF_VER}-${TARGET}.tar.gz" \
            -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /tmp
          "/tmp/git-cliff-${CLIFF_VER}/git-cliff" --latest > /tmp/notes.md

          # A release can legitimately contain no user-facing change — a docs
          # pass, a CI fix. Say so, rather than publishing notes that are just
          # a bare compare link and look like the generator broke.
          if ! grep -q '^### ' /tmp/notes.md; then
            { echo "_No user-facing changes in this release._"; echo; cat /tmp/notes.md; } > /tmp/notes.tmp
            mv /tmp/notes.tmp /tmp/notes.md
          fi
          echo "--- generated notes ---"; cat /tmp/notes.md

      - name: Import the signing identity
        timeout-minutes: 3
        # Without this the runner signs ad-hoc, and an ad-hoc signature
        # identifies the app by its code hash — which changes every build. macOS
        # ties the App Management grant to the designated requirement, so every
        # released build looked like a different app and the user had to grant
        # it again after each self-update. The certificate makes the requirement
        # constant, matching what a local build produces.
        #
        # Skipped rather than failed when the secret is absent, so a fork or a
        # repo without the secret still produces a working (ad-hoc) build.
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::notice::No signing secret — this build will be ad-hoc signed."
            exit 0
          fi
          # A keychain of its own, deleted with the runner. Never the login one.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS=$(openssl rand -base64 24)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          # -A would let any binary use the key; -T limits it to codesign.
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          # A self-signed certificate imports but is not *valid* until it is
          # trusted for code signing, and `find-identity -v` — which
          # build-app.sh uses to choose — only counts valid ones. Without this
          # the import reports "2 identities imported" and the build still signs
          # ad-hoc. signing-identity.sh does the same thing locally.
          # The p12 can hold more than one identity: `security export` takes
          # every identity in the keychain and cannot filter by name, so this
          # one also carries an unrelated "localhost" certificate. Trusting
          # whichever certificate came out first trusted that one instead, and
          # the build signed ad-hoc three releases running while the step
          # reported success. Pick by common name.
          openssl pkcs12 -in "$RUNNER_TEMP/id.p12" -clcerts -nokeys \
            -passin "pass:$P12_PASSWORD" -legacy 2>/dev/null > "$RUNNER_TEMP/all.pem" \
            || openssl pkcs12 -in "$RUNNER_TEMP/id.p12" -clcerts -nokeys \
                 -passin "pass:$P12_PASSWORD" 2>/dev/null > "$RUNNER_TEMP/all.pem"
          awk -v d="$RUNNER_TEMP" 'BEGIN{n=0} /BEGIN CERTIFICATE/{n++; f=d"/c"n".pem"} n>0{print > f}' \
            "$RUNNER_TEMP/all.pem"
          CERT=""
          for f in "$RUNNER_TEMP"/c*.pem; do
            if openssl x509 -in "$f" -noout -subject 2>/dev/null | grep -q "CN *= *UpdateAll Local Signing"; then
              CERT="$f"; break
            fi
          done
          [[ -n "$CERT" ]] || { echo "::error::no UpdateAll Local Signing certificate in the secret"; exit 1; }
          echo "trusting $(openssl x509 -in "$CERT" -noout -subject)"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP"/*.pem
          # Without this codesign stops for a GUI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          # build-app.sh looks for the identity via find-identity, which searches
          # the keychain list rather than a named keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Fail loudly here rather than silently producing an ad-hoc build.
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "UpdateAll Local Signing" \
            || { echo "::error::identity imported but not valid for code signing"; exit 1; }

      - name: Build .app
        env:
          SKIP_INSTALL: 1
        run: ./build-app.sh

      - name: Zip the .app
        run: |
          ZIP="UpdateAll-${{ steps.compute.outputs.tag }}.zip"
          ditto -c -k --keepParent UpdateAll.app "$ZIP"
          ls -la "$ZIP"

      - name: Push tag
        run: git push origin "${{ steps.compute.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.compute.outputs.tag }}"
          ZIP="UpdateAll-${TAG}.zip"
          if [[ -n "${{ inputs.notes }}" ]]; then
            gh release create "$TAG" --title "$TAG" --notes "${{ inputs.notes }}" "$ZIP"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md "$ZIP"
          fi
