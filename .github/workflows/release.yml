name: Release

# Manually-triggered build + release pipeline.
# Go to Actions → Release → Run workflow → enter tag (e.g. v1.2.0) → optional notes.
# Only people with write access to the repo can trigger this — so for a
# personal/private repo, that's just the owner.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
      notes:
        description: "Release notes (markdown). Leave empty to auto-generate from commits."
        required: false
        default: ""

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so build-app.sh can run `git describe --tags` and
          # `git rev-list --count` to stamp a real version into Info.plist
          fetch-depth: 0

      - name: Sanity check — tag does not already exist
        run: |
          if git rev-parse "${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create local tag (so build-app.sh stamps the right version)
        run: git tag -a "${{ inputs.tag }}" -m "${{ inputs.tag }}"

      - name: Build .app
        env:
          SKIP_INSTALL: 1
        run: ./build-app.sh

      - name: Zip the .app
        run: |
          ditto -c -k --keepParent UpdateAll.app "UpdateAll-${{ inputs.tag }}.zip"
          ls -la "UpdateAll-${{ inputs.tag }}.zip"

      - name: Push tag
        run: git push origin "${{ inputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ inputs.notes }}" ]]; then
            gh release create "${{ inputs.tag }}" \
              --title "${{ inputs.tag }}" \
              --notes "${{ inputs.notes }}" \
              "UpdateAll-${{ inputs.tag }}.zip"
          else
            gh release create "${{ inputs.tag }}" \
              --title "${{ inputs.tag }}" \
              --generate-notes \
              "UpdateAll-${{ inputs.tag }}.zip"
          fi
